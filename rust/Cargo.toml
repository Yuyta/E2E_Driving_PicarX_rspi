[package]
name = "picar-x-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = "0.17.2"
rodio = "0.22.2"
rppal = "0.22.1"
eframe = { version = "0.33", features = ["wgpu"] }
ureq = { version = "2.12", default-features = false, features = ["json", "tls", "native-certs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
base64 = "0.22"
rusqlite = { version = "0.34", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

