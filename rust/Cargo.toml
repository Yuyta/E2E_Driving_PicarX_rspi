[package]
name = "picar-x-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
rodio = "0.22.2"
rppal = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
base64 = "0.22"
chrono = "0.4"
axum = "0.8"
tokio = { version = "1.43", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
