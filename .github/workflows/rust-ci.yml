name: Rust CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.95 toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-rust-quality-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-quality-

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev

      - name: Check formatting
        id: format
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Clippy
        id: clippy
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Add quality summary
        if: ${{ always() }}
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
        run: |
          {
            echo "## Rust quality"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| rustfmt | ${FORMAT_OUTCOME} |"
            echo "| Clippy (`-D warnings`) | ${CLIPPY_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit tests and JUnit report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.95 toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-rust-tests-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-tests-

      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit tests and write JUnit XML
        id: tests
        working-directory: rust
        run: |
          mkdir --parents test-results
          set +e
          cargo nextest run --locked --release --profile ci
          test_status=$?
          set -e
          if [ -f target/nextest/ci/junit.xml ]; then
            cp target/nextest/ci/junit.xml test-results/junit.xml
          else
            echo "JUnit XML was not generated by cargo-nextest."
          fi
          exit "$test_status"

      - name: Publish JUnit test report
        if: ${{ always() }}
        uses: dorny/test-reporter@v1
        with:
          name: Rust unit tests
          path: rust/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Add test summary
        if: ${{ always() }}
        run: python3 rust/build/junit_summary.py rust/test-results/junit.xml

      - name: Upload JUnit XML
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-unit-test-results
          path: rust/test-results/junit.xml
          if-no-files-found: warn

  build-3bplus:
    name: Cross-build for Raspberry Pi 3B+
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build cross-compilation image
        run: make -C rust/build image

      - name: Build release binary
        id: build
        run: make -C rust/build build MODEL=3bplus

      - name: Add build summary
        if: ${{ always() }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "## Raspberry Pi 3B+ build"
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Target | aarch64-unknown-linux-gnu |"
            echo "| CPU | cortex-a53 |"
            echo "| Result | ${BUILD_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload 3bplus binary
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: picar-x-rust-3bplus
          path: rust/target/aarch64-unknown-linux-gnu/release/picar-x-rust
          if-no-files-found: error
