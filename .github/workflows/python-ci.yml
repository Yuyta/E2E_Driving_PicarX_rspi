name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install Qt runtime libraries
        working-directory: .
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install dependencies
        # テストが torch、onnx、cv2 を使うので e2e も入れる
        run: uv sync --frozen --extra dev --extra e2e

      - name: Run Ruff
        run: uv run --frozen ruff check .

      - name: Run pytest
        run: uv run --frozen pytest -q
