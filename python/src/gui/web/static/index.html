<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="picarx-token" content="__PICARX_TOKEN__">
  <title>PiCar-X Control Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M8 20h16l-2-6H10z' fill='white'/%3E%3Ccircle cx='11' cy='22' r='2.5' fill='white'/%3E%3Ccircle cx='21' cy='22' r='2.5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="メニュー">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 15.5V12l2.2-4.6A2 2 0 0 1 7 6.3h10a2 2 0 0 1 1.8 1.1L21 12v3.5a1 1 0 0 1-1 1h-1a2.5 2.5 0 0 1-5 0h-4a2.5 2.5 0 0 1-5 0H4a1 1 0 0 1-1-1zM6 11.5h12l-1.4-3H7.4z"/></svg>
        </span>
        <span><b>PiCar-X</b><small>Control Center</small></span>
      </div>
      <nav id="nav">
        <a href="#/overview" data-route="overview"><i data-icon="grid"></i>概要</a>
        <div class="nav-group">MLOps</div>
        <a href="#/models" data-route="models"><i data-icon="cube"></i>モデル</a>
        <a href="#/compare" data-route="compare"><i data-icon="compare"></i>比較・評価</a>
        <a href="#/data" data-route="data"><i data-icon="db"></i>データ</a>
        <a href="#/lineage" data-route="lineage"><i data-icon="flow"></i>来歴</a>
        <a href="#/runs" data-route="runs"><i data-icon="road"></i>走行記録</a>
        <div class="nav-group">実行</div>
        <a href="#/tools" data-route="tools"><i data-icon="play"></i>ツール</a>
        <a href="#/jobs" data-route="jobs"><i data-icon="list"></i>ジョブ<span id="nav-running" class="nav-count" hidden></span></a>
      </nav>
      <div class="sidebar-foot">
        <button id="theme-toggle" class="ghost small" type="button" title="表示の明暗を切り替え">テーマ</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button id="menu-toggle" class="ghost icon-only" type="button" aria-label="メニュー">☰</button>
        <h1 id="page-title">概要</h1>
        <div class="topbar-right">
          <span id="robot-pill" class="pill neutral" title="Pi の API サーバーへの接続"><span class="dot"></span>Pi 確認中…</span>
          <button id="refresh" class="ghost small" type="button" title="最新の状態を読み直す">更新</button>
          <button id="estop" class="estop" type="button" title="車体を緊急停止し、動いている走行ジョブも止める">■ 緊急停止</button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="tooltip" role="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
