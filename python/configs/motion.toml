# 指令と実際の動きの食い違いの検出の設定（ROADMAP の M3）
# 実機の計測（src.e2e.m3_check）で校正した値をここに書く。未校正の値は提案値。
# 収集 GUI と自律走行が起動時に読む。

[tracker]
interval_s = 0.3          # 比べるフレームの時間差
hfov_deg = 53.5           # カメラの水平画角。未校正（OV5647 の値）
moving_px_s = 5.1         # 画像が動いたとみなす動きの大きさ（ピクセル/秒）。2026-11-09 校正（静止 p99 最大 2.2、走行 p10 最小 11.5）
max_distance_cm = 150.0
max_approach_cm_s = 100.0

[checker]
min_check_speed = 40      # 車が確実に進む最低の速度（src/models.py の MIN_MOVING_SPEED）
settle_s = 0.5
min_turn_steer_deg = 15.0
straight_steer_deg = 3.0
min_turn_rate_dps = 8.0
straight_max_rate_dps = 15.0  # 2026-11-09 確認。舵の中心を補正（Pi の DIR_SERVO_OFFSET=6）した後の直進は -7.9〜+3.7°/s
still_cm_s = 2.0
uncommanded_min_inliers = 0.6
# 曲がり方を確かめるのは、向きの推定が信頼できる時だけ（2026-11-12、白い部屋で直進中の
# フレームの半分に誤った turn_mismatch が付いた。信頼できる推定だけなら直進のずれは -0.1°/s）
turn_min_points = 60
turn_min_inliers = 0.6
uncommanded_px_s = 6.7        # 2026-11-09 校正（人が横切る p99 2.2、押す p50 20.3）
sustain_s = 1.0
# 校正したら書く（どちらかが未設定なら、曲がる量ではなく向きの符号だけを確かめる）
speed_cm_s_per_unit = 0.227   # 2026-11-09、速度50で 11.3cm/s（壁への接近）。速度40で 7〜10cm/s と、比例よりやや速い
# wheelbase_cm = 0.0
