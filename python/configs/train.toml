# 走行モデルの学習設定（ROADMAP の M3）
# 学習と交差検証はこの値を使う。コマンドラインの引数で上書きできる。
# 使ったデータ、コード、環境とあわせて models/<版>/metadata.json に記録される。

epochs = 15
batch_size = 32
lr = 0.001
seed = 42

# 検証に使うセッション ID。空なら名前順で最後のセッション
val_sessions = []

# 前方が塞がっているかの補助出力（超音波の距離から自動でラベルを付ける）。
# 重みが 0 なら学習せず、舵角の学習結果はこの出力がない時と同じになる。
# 交差検証で舵角が悪くならないことを確かめてから、0 より大きくする
blocked_loss_weight = 0.0
blocked_near_cm = 40.0   # これより近ければ「塞がっている」
blocked_clear_cm = 60.0  # これ以上遠いか反射が戻らなければ「空いている」。間は使わない

# 曲がりの区間（自動収集の avoid と open_turn、その後に舵が戻るまで）に、曲がった向きを意図として
# 付け直す。どちらへ曲がるかは上の層が意図で与え、いつ曲がるかは前方が塞がっているかの出力で決める
# （2026-11-14、利用者の判断）。false にすると 2026-11-14 の交差検証（±11.24°）と同じ条件になる
turn_intent = true

# 学習用のフレームに、左右反転した複製を加える（舵角の符号と意図の左右を入れ替える）。
# 右へ曲がるフレームが左の半分ほどしかない偏りを補う。評価は元のフレームだけで行う。
# 交差検証（2026-11-14）では ±5.59° で、反転なしの ±5.56° と変わらなかった。右は良くなり
# 左は悪くなった。学習の時間が倍になるので false のままにする
flip_augment = false
